  title: National Map 1:25'000
  description: The National Map 1:25,000 is a topographic map of Switzerland representing
    the areas of traffic and settlements, the topography and the vegetation in great
    detail. The map perimeter is divided into 247 individual sheets. The map content
    is updated in a regular six-year cycle according to a revision plan dividing Switzerland
    in six sectors. The National Map 1:25,000 is published in analogue format as a
    printed map and in digital format as the Swiss Map Raster.
