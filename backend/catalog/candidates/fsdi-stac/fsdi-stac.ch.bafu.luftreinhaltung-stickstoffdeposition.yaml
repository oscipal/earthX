harvested:
  title: Nitrogen Deposition
  description: The time series shows the modelled total deposition of nitrogen for
    the years 1990, 2000, 2005, 2010, 2015 and 2020 in a resolution of 500m as a sum
    of wet, dry and gaseous deposition. Nationwide deposition in 2020 amounted to
    a total of 59'000 tonnes of nitrogen. On average, reduced nitrogen compounds (NH₃,
    NH₄⁺) accounted for two thirds of the deposition. This percentage can strongly
    vary locally depending on the amount of wet deposition and nearby emission sources.
    The modelled values are based on average meteorological conditions. Detailed information
    about the model can be found in the report Critical Loads of Nitrogen and their
    Exceedances. Actual nitrogen deposition can deviate from the modelled grid data.
    Single pixels must not be used for assessing deposition at single sites.
