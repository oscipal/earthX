harvested:
  title: Szenarien des kantonalen Klimamodells
  description: Dem Klimamodell liegt als meteorologische Rahmenbedingung eine windschwache
    Wetterlage im Sommer zugrunde, da sich die siedlungsklimatischen Effekte vor allem
    während windschwacher Wetterlagen mit geringer Wolkenbedeckung im Sommer entwickeln.
    Charakteristisch für diese (Hochdruck-) Wetterlage ist die lokale Entstehung von
    Kaltluftströmungen (Flurwinde in ebener Lage und Kaltluftabflüsse über den Hängen),
    die durch den Temperaturgradienten zwischen kühlen Freiflächen und wärmeren Siedlungsräumen
    angetrieben werden und zu einem Abbau der Wärmebelastung in der Bebauung beitragen.
    Dabei geht es weniger um den Aufenthalt im Freien als vielmehr um die Wärmereduktion
    im Innenraum zur Verbesserung der Schlafumfeldbedingungen. Dazu wurden für die
    Nachtsituation die meteorologischen Parameter bodennahe Lufttemperatur, Kaltluftproduktionsrate,
    das bodennahe Kaltluftströmungsfeld sowie der Kaltluftvolumenstrom modelliert.
    Die Wärmebelastung am Tage im Freien wird über die Physiologisch Äquivalente Temperatur
    (PET) repräsentiert. Für das Zukunftsszenario im Jahr 2060 wird eine mittlere
    sommerliche Temperaturzunahme von 2,6 K zugrunde gelegt (vgl. Kap. 3.4.4 Erläuterungsbericht).
    Die unterschiedlichen Nutzungsstrukturen wirken darauf verstärkend (überbaute
    Räume) oder abschwächend (Grünräume) ein. Im Allgemeinen werden aber sowohl die
    Grünflächen als auch der Siedlungsraum wärmer. Die Grünflächen liefern aber auch
    zukünftig kalte Luft. Allerdings ist diese - unter dem Einfluss des Klimawandels
    - etwas wärmer verglichen mit der Gegenwart, aber immer noch kühler als die Siedlungsräume.
    Die relativen Temperaturunterschiede zwischen den Landnutzungen sowie der Luftaustausch
    insgesamt bleiben ähnlich ausgeprägt. Erläuterungsbericht (https://geofiles.be.ch/geoportal/pub/lpi/KLIMAMODELL_BE_Bericht_DE.pdf).
    Die simulierten Parameter stellen die Grundlage für die Herleitung der Klimaanalyse-
    und Planungshinweiskarten dar.
