# EarthX CI skeleton (M0 step 2, ENTSCHEIDUNGEN_2026-09-18.md §6).
# What runs where is decided in docs/adr/0002-testaufteilung.md.
# No job reaches an external data source; no job needs a token.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest

    # The T-C tests of M1-04 run against a real Postgres, in CI and in the cloud
    # session alike (docs/adr/0002-testaufteilung.md §2). They are part of the same
    # `pytest` both places run (§6), so the service belongs on this job rather than
    # on one of its own. Same image as docker-compose.yml.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: earthx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d earthx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for a container that lives for the length of this job.
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci-throwaway
      PGDATABASE: earthx

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First step of every required job (docs-only PRs, Otto 2026-11-06): the job always
      # runs, so the required check never stays pending, but a PR whose own changes lie
      # only under docs/ skips the rest. Rules: scripts/ci-scope.sh.
      - name: Scope (docs-only pull request?)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ github.workspace }}
        run: scripts/ci-scope.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # Docs-only PR: the two checks on files under docs/ (test_plans_layout,
      # test_decision_log_format) need pytest and pytest-xdist only. Their pins and
      # hashes are taken from the lock file; `--noconftest` because the shared conftest
      # imports the whole stack.
      - name: Docs checks (docs-only pull request)
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          awk '/^[A-Za-z0-9]/ { keep = ($1 ~ /^(pytest|pytest-xdist|execnet|iniconfig|packaging|pluggy|pygments)==/) } keep && !/^ *#/' \
            backend/requirements-dev.lock > "$RUNNER_TEMP/docs-checks.lock"
          pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/docs-checks.lock"
          pytest --noconftest -o addopts="-ra --strict-markers --strict-config" \
            backend/tests/test_plans_layout.py backend/tests/test_decision_log_format.py

      # From the lock file, hash-checked (M4-00b). Why these options, and in this
      # order: scripts/lock-backend.sh.
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: --no-binary version-parser \
            -r backend/requirements-dev.lock

      # Bit-exact tests (adr/0016 §3.3, adr/0014 §6.3) depend on the CPU the runner lands
      # on, which ubuntu-latest does not fix. This puts what they depend on into the log.
      - name: CPU and numeric libraries (for bit-exact tests)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          lscpu
          /lib64/ld-linux-x86-64.so.2 --list-diagnostics \
            | grep -E '^x86\.cpu_features\.(basic\.|features\[0x[01]\]\.active|preferred|isa_1)' || true
          python - <<'EOF'
          import ctypes, glob, os
          import numexpr, numpy, pyproj, rasterio, shapely
          numpy.show_runtime()
          print("numexpr", numexpr.__version__, "threads", numexpr.nthreads)
          print("pyproj", pyproj.__version__, "PROJ", pyproj.proj_version_str, "shapely", shapely.__version__, "GEOS", shapely.geos_version_string)
          print("rasterio", rasterio.__version__, "GDAL", rasterio.__gdal_version__)
          for lib in glob.glob(os.path.join(os.path.dirname(rasterio.__file__), os.pardir, "rasterio.libs", "libgdal*")):
              gdal = ctypes.CDLL(lib)
              gdal.GDALVersionInfo.restype = ctypes.c_char_p
              print(gdal.GDALVersionInfo(b"BUILD_INFO").decode())
          EOF

      - name: Lint (ruff)
        if: steps.scope.outputs.docs_only != 'true'
        run: ruff check backend

      # Installs the pgstac schema the T-C tests read. The version comes from the
      # pin in backend/requirements.txt — there is no second place that sets it.
      - name: Migrate pgstac
        if: steps.scope.outputs.docs_only != 'true'
        run: pypgstac migrate

      - name: Tests (pytest)
        if: steps.scope.outputs.docs_only != 'true'
        run: pytest

  frontend:
    name: Frontend — lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs skip the steps below, the job itself still runs (scripts/ci-scope.sh).
      - name: Scope (docs-only pull request?)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ github.workspace }}
        run: scripts/ci-scope.sh

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci

      - name: Lint (oxlint)
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Type check (tsc)
        if: steps.scope.outputs.docs_only != 'true'
        run: npx tsc -b --pretty false

      - name: Tests (vitest)
        if: steps.scope.outputs.docs_only != 'true'
        run: npm test

  import-boundaries:
    name: Module boundaries (import-linter)
    # Gates every PR (M1-02): the target package backend/earthx/ exists now,
    # so a violation of architekturplan.md 3.1 has something to be caught in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs skip the steps below, the job itself still runs (scripts/ci-scope.sh).
      - name: Scope (docs-only pull request?)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ github.workspace }}
        run: scripts/ci-scope.sh

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pip install --require-hashes --only-binary :all: --no-binary version-parser \
            -r backend/requirements-dev.lock
      - name: Check import contracts (lint-imports)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          PYTHONPATH: backend
        run: lint-imports --config .importlinter

  compose-topology:
    name: Compose topology
    # M1-08 (docs/plans/m1-08-compose-topologie.md): one image, four start
    # commands (architekturplan.md 3.2, 12.1). Docker never runs in the cloud
    # session (adr/0002 §1, cloud-umgebung.md §4) — this job is the only place
    # that actually exercises `docker compose`.
    # M3-23 (adr/0012): renamed from "Compose topology (…, minio)" — the
    # object store is Garage now, and the name no longer names a product, so
    # a future replacement does not need a second rename here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs skip the steps below, the job itself still runs (scripts/ci-scope.sh).
      - name: Scope (docs-only pull request?)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ github.workspace }}
        run: scripts/ci-scope.sh

      - name: Write throwaway .env (CI only, never a real secret)
        if: steps.scope.outputs.docs_only != 'true'
        # No S3_* here on purpose: this exercises the same generate-on-first-start
        # path a fresh local checkout takes (docker-compose.yml, objectstore-secrets).
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-throwaway
          POSTGRES_DB=earthx
          EOF

      - name: Build images
        if: steps.scope.outputs.docs_only != 'true'
        run: docker compose build

      # M4-16b (adr/0016 F7 Teil 2, §12b): the runner stage of backend/Dockerfile
      # on the layers the build above left in the cache. The checks run with the
      # hardening the README names for users: read-only root, no capabilities,
      # no network.
      - name: Build the runner image
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          docker build --target runner \
            --build-arg "EARTHX_COMMIT=${GITHUB_SHA::7}" \
            -t earthx-runner:ci backend

      - name: Runner runs as UID 10001
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uid="$(docker run --rm --entrypoint id earthx-runner:ci -u)"
          [ "$uid" = "10001" ] || { echo "runner user is $uid, expected 10001"; exit 1; }

      - name: Runner and worker report the same engine versions
        if: steps.scope.outputs.docs_only != 'true'
        env:
          COMMIT: ${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            earthx-runner:ci versions > runner-versions.json
          docker compose run -T --rm --no-deps worker python -c \
            'import json; from earthx.processing.recipe import engine_versions; print(json.dumps(engine_versions(), sort_keys=True))' \
            > worker-engine.json
          python3 - <<'EOF'
          import json, os
          runner = json.load(open("runner-versions.json"))
          worker = json.load(open("worker-engine.json"))
          print("runner:", runner["engine"])
          print("worker:", worker)
          assert runner["engine"] == worker, "engine versions differ"
          assert runner["runner_version"].endswith("+g" + os.environ["COMMIT"][:7]), runner["runner_version"]
          assert runner["platform"]["machine"] == "x86_64", runner["platform"]
          EOF

      # The runner stage adds only ENV, USER and ENTRYPOINT: its layers must be
      # exactly those of the worker image, so what the pytest comparison proves
      # about the code (tests/earthx/runner/test_compare.py) holds for the files
      # in this image. A run on a local input cannot go through the image: the
      # gateway clears only public https addresses of declared hosts, and the
      # seams the comparison uses exist only in pytest (docs/plans/m4-16-lokaler-runner.md §10).
      - name: Runner image carries the same layers as the worker image
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          worker_image="$(docker compose config --images | grep -E -- '-worker$')"
          [ "$(echo "$worker_image" | wc -l)" = "1" ] || { echo "no unique worker image: $worker_image"; exit 1; }
          layers() { docker inspect --format '{{json .RootFS.Layers}}' "$1"; }
          echo "worker: $(layers "$worker_image")"
          echo "runner: $(layers earthx-runner:ci)"
          [ "$(layers "$worker_image")" = "$(layers earthx-runner:ci)" ] || { echo "layers differ"; exit 1; }

      - name: Runner checks the synthetic recipe and names its one host
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          hosts="$(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            -v "$GITHUB_WORKSPACE/backend/tests/fixtures/runner:/in:ro" \
            earthx-runner:ci check /in/recipe-ci.json)"
          [ "$hosts" = "e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com" ] \
            || { echo "unexpected hosts: $hosts"; exit 1; }

      - name: Runner without a network ends with exit code 4 and no result
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          out="$RUNNER_TEMP/runner-out"
          mkdir "$out"
          chmod 777 "$out"
          code=0
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            -v "$GITHUB_WORKSPACE/backend/tests/fixtures/runner:/in:ro" \
            -v "$out:/out" \
            earthx-runner:ci run /in/recipe-ci.json || code=$?
          [ "$code" = "4" ] || { echo "expected exit code 4, got $code"; exit 1; }
          if find "$out" -type f | grep -q .; then
            echo "a failed run left files behind:"
            find "$out" -type f
            exit 1
          fi

      - name: Start topology
        if: steps.scope.outputs.docs_only != 'true'
        run: docker compose up -d

      - name: Wait for all services to report healthy
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          services="postgres objectstore api tiler worker harvester"
          for i in $(seq 1 30); do
            unhealthy=""
            for s in $services; do
              cid="$(docker compose ps -q "$s")"
              status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)"
              [ "$status" = "healthy" ] || unhealthy="$unhealthy $s($status)"
            done
            [ -z "$unhealthy" ] && { echo "All services healthy."; exit 0; }
            echo "Waiting on:$unhealthy"
            sleep 5
          done
          echo "Timed out waiting for healthy services."
          docker compose logs
          exit 1

      - name: One-shot steps ran successfully
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          for s in pgstac-migrate catalog-load objectstore-secrets objectstore-init; do
            code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq "$s")")"
            if [ "$code" != "0" ]; then
              echo "$s exited with $code"
              docker compose logs "$s"
              exit 1
            fi
          done

      - name: Object store credentials for the smoke steps (masked)
        if: steps.scope.outputs.docs_only != 'true'
        id: objectstore-creds
        run: |
          creds="$(docker compose run --rm --no-deps objectstore-secrets show)"
          access_key="$(echo "$creds" | grep '^S3_ACCESS_KEY=' | cut -d= -f2-)"
          secret_key="$(echo "$creds" | grep '^S3_SECRET_KEY=' | cut -d= -f2-)"
          bucket="$(echo "$creds" | grep '^S3_BUCKET=' | cut -d= -f2-)"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "access_key=$access_key" >> "$GITHUB_OUTPUT"
          echo "secret_key=$secret_key" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          # M4-06 (adr/0015 §6.4): the two service keys, masked before use.
          for name in JOBS_ACCESS_KEY JOBS_SECRET_KEY API_ACCESS_KEY API_SECRET_KEY; do
            value="$(echo "$creds" | grep "^S3_${name}=" | cut -d= -f2-)"
            echo "::add-mask::$value"
            echo "$(echo "$name" | tr '[:upper:]' '[:lower:]')=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: compose/objectstore/requirements-smoke.lock

      # From the lock file, hash-checked (M4 R4; scripts/lock-backend.sh).
      - name: Install object store smoke dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pip install --require-hashes --only-binary :all: \
            -r compose/objectstore/requirements-smoke.lock

      - name: Object store smoke (adr/0012 §9 — confirms the official image)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          S3_ACCESS_KEY: ${{ steps.objectstore-creds.outputs.access_key }}
          S3_SECRET_KEY: ${{ steps.objectstore-creds.outputs.secret_key }}
          S3_BUCKET: ${{ steps.objectstore-creds.outputs.bucket }}
          S3_JOBS_ACCESS_KEY: ${{ steps.objectstore-creds.outputs.jobs_access_key }}
          S3_JOBS_SECRET_KEY: ${{ steps.objectstore-creds.outputs.jobs_secret_key }}
          S3_API_ACCESS_KEY: ${{ steps.objectstore-creds.outputs.api_access_key }}
          S3_API_SECRET_KEY: ${{ steps.objectstore-creds.outputs.api_secret_key }}
        run: python compose/objectstore/smoke.py --write-marker

      - name: Restart one service, all stay (or become) healthy
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          docker compose restart worker
          services="postgres objectstore api tiler worker harvester"
          for i in $(seq 1 30); do
            unhealthy=""
            for s in $services; do
              cid="$(docker compose ps -q "$s")"
              status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)"
              [ "$status" = "healthy" ] || unhealthy="$unhealthy $s($status)"
            done
            [ -z "$unhealthy" ] && { echo "All services healthy after the restart."; exit 0; }
            echo "Waiting on:$unhealthy"
            sleep 5
          done
          echo "Timed out: restarting one service left another unhealthy."
          docker compose logs
          exit 1

      - name: Second start with the existing volume
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          docker compose down
          docker compose up -d
          services="postgres objectstore api tiler worker harvester"
          for i in $(seq 1 30); do
            unhealthy=""
            for s in $services; do
              cid="$(docker compose ps -q "$s")"
              status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)"
              [ "$status" = "healthy" ] || unhealthy="$unhealthy $s($status)"
            done
            [ -z "$unhealthy" ] && { echo "All services healthy on the second start."; exit 0; }
            echo "Waiting on:$unhealthy"
            sleep 5
          done
          echo "Timed out on the second start."
          docker compose logs
          exit 1

      - name: One-shot steps ran successfully on the second start
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          for s in pgstac-migrate catalog-load objectstore-secrets objectstore-init; do
            code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq "$s")")"
            if [ "$code" != "0" ]; then
              echo "$s exited with $code"
              docker compose logs "$s"
              exit 1
            fi
          done

      - name: Object store credentials are unchanged, and the earlier object is still there
        if: steps.scope.outputs.docs_only != 'true'
        env:
          S3_ACCESS_KEY: ${{ steps.objectstore-creds.outputs.access_key }}
          S3_SECRET_KEY: ${{ steps.objectstore-creds.outputs.secret_key }}
          S3_BUCKET: ${{ steps.objectstore-creds.outputs.bucket }}
        run: |
          creds="$(docker compose run --rm --no-deps objectstore-secrets show)"
          echo "$creds" | grep -qF "S3_ACCESS_KEY=$S3_ACCESS_KEY"
          echo "$creds" | grep -qF "S3_SECRET_KEY=$S3_SECRET_KEY"
          python compose/objectstore/smoke.py --persisted

      - name: Logs (always, for diagnosis)
        if: always() && steps.scope.outputs.docs_only != 'true'
        run: docker compose logs

      - name: Tear down
        if: always() && steps.scope.outputs.docs_only != 'true'
        run: docker compose down -v

  # TEMPORARY (diagnosis of the red bit-exact tests, 10.11.2026): six runners at once, each
  # reports its CPU and runs the three failing tests under several CPU feature levels.
  # Removed again before the pull request is ready.
  cpu-sample:
    name: CPU sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: --no-binary version-parser \
            -r backend/requirements-dev.lock
      - name: CPU
        run: |
          lscpu | grep -E 'Vendor|Model name|^CPU\(s\)|Flags'
          free -m | head -2
          python -c 'import numpy; print(numpy.show_runtime())' 2>&1 | grep -A3 simd
          /lib64/ld-linux-x86-64.so.2 --list-diagnostics | grep -E 'features\[0x0\]\.active\[0x2\]|features\[0x1\]\.active\[0x1\]|isa_1'
          GLIBC_TUNABLES='glibc.cpu.hwcaps=-AVX2,-FMA,-AVX512F,-AVX512CD,-AVX512BW,-AVX512DQ,-AVX512VL' \
            /lib64/ld-linux-x86-64.so.2 --list-diagnostics | grep -E 'features\[0x0\]\.active\[0x2\]|features\[0x1\]\.active\[0x1\]|isa_1'
      - name: The three tests, outputs kept
        run: |
          pytest -n0 -p no:cacheprovider --basetemp="$RUNNER_TEMP/bt" -o addopts="-ra" -q \
            backend/tests/earthx/processing/test_mosaic.py::TestTheRuleOfTheExport \
            backend/tests/earthx/processing/test_band_math.py::TestBitStabilityAcrossCpuLevels || true
      - name: Export under feature levels
        run: |
          D_NPY="X86_V3 X86_V4 AVX512_ICL AVX512_SPR"
          D_GL="glibc.cpu.hwcaps=-AVX2,-FMA,-AVX512F,-AVX512CD,-AVX512BW,-AVX512DQ,-AVX512VL"
          t="backend/tests/earthx/processing/test_mosaic.py::TestTheRuleOfTheExport"
          run() { echo "== $1: $(env "${@:2}" pytest -n0 -p no:cacheprovider -o addopts= -q -k test_both_compute "$t" 2>&1 | tail -1)"; }
          run A
          run B NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR"
          run D NPY_DISABLE_CPU_FEATURES="$D_NPY" GLIBC_TUNABLES="$D_GL"
          run E GLIBC_TUNABLES="$D_GL"
          run GDAL-no-simd GDAL_USE_AVX=NO GDAL_USE_SSSE3=NO GDAL_USE_SSE=NO
          run single-cpu taskset -c 0
      - name: numexpr functions, A against D
        run: |
          for s in A D; do
            if [ "$s" = D ]; then export GLIBC_TUNABLES="glibc.cpu.hwcaps=-AVX2,-FMA,-AVX512F,-AVX512CD,-AVX512BW,-AVX512DQ,-AVX512VL"; fi
            python -I - "$s" <<'EOF'
          import hashlib, sys, numpy, numexpr
          a = numpy.random.default_rng(42).uniform(0.1, 1.5, (1024, 1024))
          out = {e: hashlib.sha256(numexpr.evaluate(e, optimization="aggressive").tobytes()).hexdigest()[:12]
                 for e in ("log(a)", "exp(a)", "a ** 51", "sin(a)", "arctan2(a, a + 1)")}
          out["numpy sin"] = hashlib.sha256(numpy.sin(a).tobytes()).hexdigest()[:12]
          print(sys.argv[1], out)
          EOF
          done
      - name: Summary of the outputs
        run: |
          python - "$RUNNER_TEMP/bt" <<'EOF'
          import hashlib, sys, glob, numpy, rasterio
          for path in sorted(glob.glob(sys.argv[1] + "/**/*.tif", recursive=True)):
              if "/export/" not in path and "/mosaic/" not in path:
                  continue
              with rasterio.open(path) as ds:
                  d = ds.read(masked=True)
                  m = numpy.ma.getmaskarray(d)
                  vals, counts = numpy.unique(d.data[~m], return_counts=True)
                  print(path.split("/")[-3:], ds.crs.to_epsg(), [repr(v) for v in tuple(ds.transform)[:6]], d.shape,
                        "masked", int(m.sum()), dict(zip(vals.tolist(), counts.tolist())),
                        "data", hashlib.sha256(d.data.tobytes()).hexdigest()[:12], "mask", hashlib.sha256(m.tobytes()).hexdigest()[:12])
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-sample-${{ matrix.sample }}
          path: ${{ runner.temp }}/bt/**/*.tif
          retention-days: 3
