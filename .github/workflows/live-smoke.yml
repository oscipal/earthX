# T-D live smoke test (docs/adr/0002-testaufteilung.md §2, M1-06).
#
# The one run that touches the real source. It is scheduled, never part of a pull
# request: a PR must not turn red because a foreign service is having a bad day.
# Cloud sessions do not run it either — `pytest` alone collects only backend/tests,
# and this directory lies outside it.
#
# Small on purpose (adr/0005 §3.6): a handful of metadata requests, no assets, no
# token. One job per source (M2-08 plan §11 F3): a red run in one never colours the
# other, and each job's own `earthx:` dataset id is what the onboarding checklist's
# point 10 (Fassung v1.1) reads off the `live_dataset` marker in `backend/tests_live/`.

name: Live smoke

on:
  schedule:
    # Daily, 05:17 UTC. Off the hour so the run does not join everyone else's.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  earth-search:
    name: Earth Search v1 still answers as recorded
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      # Named explicitly, and to its own two files: `pytest` on its own would
      # collect backend/tests instead (the offline suite), and `backend/tests_live`
      # on its own would pull in the eopf job's file too.
      - name: Live smoke (pytest backend/tests_live/test_earth_search_smoke.py backend/tests_live/test_coverage_smoke.py)
        run: pytest backend/tests_live/test_earth_search_smoke.py backend/tests_live/test_coverage_smoke.py

  eopf:
    name: EOPF Sentinel Zarr Samples Service still answers as recorded
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Live smoke (pytest backend/tests_live/test_eopf_smoke.py)
        run: pytest backend/tests_live/test_eopf_smoke.py
