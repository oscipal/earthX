harvested:
  title: Orthophotos Agglo 2021 (pixel 20 cm)
  description: 'Une photo aérienne conventionnelle comporte des décalages qui proviennent
    de l''inclinaison de la caméra et du relief du terrain. Elle n''a pas d''échelle
    uniforme. Il n''est pas possible d''y mesurer une distance comme sur une carte.
    Ce n''est en aucun cas une carte. Une orthophoto est une image aérienne dont les
    influences de l''inclinaison de la chambre de prise de vue et du relief du terrain
    sont neutralisés à l''aide d''une ortho-rectification nécessitant un modèle numérique
    de terrain. Une orthophoto a une échelle uniforme, des distances peuvent être
    mesurées comme sur une carte. Il est possible de superposer sur une orthophoto
    d''autres données géographiques. Il ne devrait pas avoir de décalage. Date d''acquisition
    : Septembre 2021'
