  title: Histo_Carte_Traite_Turin_Paris_Annexe_04_1756
  description: 'Plan topographique de la délimitation de Genève et de la Savoie levé
    le 1er avril 1756, sur papier, en application du Traité de Turin de 1754 (annexe
    de P.H. 4810) et conformément au procès-verbal du 1er février 1755 (indications
    des anciens confins). Par ailleurs, il existe deux fac-similés de ce plan, l''un
    encadré et l''autre conservé dans la collection Dumur (AEG Archives privées 247/V/135).
    Pour en savoir plus sur la série des plans annexes aux traités entre Genève et
    ses voisins, voir le descriptif du plan annexe du traité de Paris de 1749. Auteur
    : Conseil ordinaire - Petit Conseil - Conseil des XXV (vingt-cinq) Au 15ème siècle,
    le petit conseil (Conseil des XXV, conseil ordinaire) est formé de 12, puis 20
    ou 25 membres, désignés par les syndics et leurs collègues sortant de charge.
    Il siège une fois par semaine. Il y a également le Conseil des Deux-Cents. L''assemblée
    des citoyens mâles s''appelle le Conseil général. On trouve dans les registres
    du Conseil, les procès-verbaux des séances du Petit Conseil, en quelque sorte
    l''ancêtre du Conseil d''Etat quoi qu''il n''y ait pas encore de séparation stricte
    des pouvoirs. On y trouve également les accessions à la bourgeoisie, les jugements
    criminels, etc. ce jusqu''à la fin de l''Ancien Régime'
