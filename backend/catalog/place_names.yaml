# The names under which catalogues write the places of `regions.json` (M5-20 plan §6.2, §13b; F2 = 1). Read by the report
# of the harvest to turn a place text or a publisher into regions; a decision in Git like `categories.yaml`. Names are
# compared as the search compares (lower case, without accents, every run of other characters one space), and only as
# a whole text or a whole sequence of words: never part of a word, never fuzzy.
#
# Names here are from general knowledge [S]; Otto checks them in review. Municipalities of CH, DE and AT are not here:
# their outlines need an official source whose licence Otto grades first (F9). Until then a municipality's name does
# not match, and a find falls to its publisher or the state of its catalogue.

# --- 1. Places: a code of regions.json -> its names -------------------------------------------------------------------
# A name in `ambiguous` (below) matches only after a designation ("Kanton Bern", "Canton de Berne"), because it is also
# a municipality's name.
places:
  CH: [Schweiz, Switzerland, Suisse, Svizzera, Svizra, Schweizerische Eidgenossenschaft, Confédération suisse,
       Confederazione Svizzera, Swiss Confederation]
