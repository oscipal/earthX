harvested:
  title: Modelldaten langfristiges Ertragspotenzial Offshore-Windenergie Nordsee -
    Szenario 2 2006 -08
  description: Die Daten umfassen die im deutschen Hoheitsgebiet und der ausschließlichen
    Wirtschaftszone (AWZ) errechneten Erträge von Windparks und die dafür relevanten
    Windbedingungen unter der Annahme eines Ausbaus der Offshore Windenergie definiert
    in unterschiedlichen Szenarien. Die Berechnungen wurden mit dem numerischen Wettermodell
    WRF unter Nutzung einer Parametrisierung von Windparks nach Fitch durchgeführt.
    Die Daten liegen in 10-minütlicher zeitlicher und 2 km x 2 km räumlicher Auflösung
    für die Nordsee für das meteorologische Jahr 2006 vor. Die Variablen des Datensatzes
    sind Windgeschwindigkeit (WS) und Windrichtung (WD) auf 9 Höhenleveln zwischen
    50 m und 350 m, die Leistung (POWER) der Windturbinen aus jeder Gitterzelle und
    die Luftdichte. Eine genauere Beschreibung der Variablen findet sich in den Dateien.
