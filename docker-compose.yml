# EarthX compose topology (architekturplan.md 3.2, 12.1; docs/plans/m1-08-compose-topologie.md,
# docs/plans/m1-07-stac-api.md §8).
#
# One image (backend/Dockerfile), four start commands: api, tiler, worker,
# harvester. tiler/worker/harvester are M1 shells: they start, report
# healthy on /health, and do nothing else. api serves the outward STAC API
# (M1-07) and is the only process that needs the collection catalog-load
# writes.
#
# Configuration only via environment variables (.env, see .env.example).
# No secrets in this file itself.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: installs the pgstac schema, then exits. Not part of the
  # "four processes" — it only prepares postgres for them.
  pgstac-migrate:
    build:
      context: ./backend
    command: ["pypgstac", "migrate"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: applies our own migrations (e.g. the search cache table from M1-06)
  # and loads the registry's collections into pgstac, then exits. Runs after
  # pgstac-migrate, because it writes into the schema that installs (M1-07;
  # earthx/catalog/load.py). Without this, a fresh compose start has neither
  # the Sentinel-2 collection nor the search cache table.
  catalog-load:
    build:
      context: ./backend
    command: ["python", "-m", "earthx.catalog.load"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully
    restart: "no"

  minio:
    # MinIO no longer publishes to Docker Hub (minio/minio); quay.io/minio/minio
    # is the current official location for the same release tags.
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    # M3-16: `--no-access-log` — uvicorn's own access log would write the raw
    # query string (an AOI as `bbox`/`intersects`); `RequestIdMiddleware`
    # (earthx.logging) is this process's access log instead.
    command: ["uvicorn", "earthx.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    environment:
      # M1-07: api now connects to Postgres itself (stac-fastapi-pgstac's own
      # asyncpg pool, and earthx.api.dependencies' psycopg pool for the search
      # cache) — both read these same libpq-style names, like pgstac-migrate
      # and catalog-load already do above. The prototype's stub never needed
      # them; the STAC API does.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      catalog-load:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  tiler:
    build:
      context: ./backend
    # M2-04: the entrypoint moved from `earthx.access.main` to `earthx.api.tiler`.
    # `access` may not import `gateway` (architekturplan.md 3.1), but the tile path
    # needs the allowlist, check_url and the GDAL configuration — so `api` composes
    # them (adr/0006 §5.1).
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.api.tiler:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8001:8000"
    environment:
      # Like `api` above: the tiler reads the item cache and the statistics cache of
      # adr/0006 from the same Postgres. Both caches are optional (a miss is slower,
      # never wrong), but the process opens the pool at startup — M1-07 showed that a
      # service without these variables does not come up at all.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The statistics cache table comes from our own migration 003, which
      # catalog-load applies.
      catalog-load:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.jobs.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  harvester:
    build:
      context: ./backend
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.discovery.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
