  CH-VS: [Wallis, Valais, Vallese]
  CH-ZG: [Zug, Zoug, Zugo]
  CH-ZH: [Zürich, Zurich, Zurigo]
  DE-BB: [Brandenburg]
  DE-BE: [Berlin]
  DE-BW: [Baden-Württemberg]
