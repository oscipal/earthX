harvested:
  title: Modellierte Temperatur und Salzgehalt des operationellen Zirkulationsmodells
    des BSH in der deutschen Bucht und der westlichen Ostsee (horizontale Auflösung
    ca. 900 m) 2026 05
  description: Modellierte Temperatur und Salzgehalt des operationellen Zirkulationsmodells
    des Bundesamtes für Seeschifffahrt und Hydrographie (BSH) in der deutschen Bucht
    und der westlichen Ostsee (horizontale Auflösung ca. 900 m). Das Modell (HBM,
    HIROMB-BOOS-Modell) läuft viermal am Tag in einer Konfiguration mit einem feineren
    Gitter in der Deutschen Bucht und westlichen Ostsee (900 m Auflösung, dieser Datensatz)
    und einem gröberen Gitter, das die gesamte Nord- und Ostsee abdeckt (5 km Auflösung,
    separater Datensatz). Das Modell wird von aktuellen Wettervorhersagen des Deutschen
    Wetterdienstes (DWD) angetrieben. Genauere Informationen über die Modellkonfiguration
    sind in Brüning et al. (2021); https://doi.org/10.23784/HN118-01; zu finden.
