harvested:
  title: Settlement
  description: "The ‘Settlement’ is a geodata set of the settled landscape from a\
    \ spatial development perspective. The data set serves as a geometric reference\
    \ for various indicators in spatial observation. What is built for residential,\
    \ work or leisure purposes is considered to be settled. This includes, in particular,\
    \ the buildings and their surroundings, as well as the adjacent roads and transport\
    \ infrastructure for their direct access. Any gaps that extend over more than\
    \ 1500 m2 remain as such. The data layer is based on data from the topographic\
    \ landscape model of swisstopo and the FSO's Register of Buildings and Dwellings.\r\
    \nThe data is updated and published annually. The time series from 2019 to 2024\
    \ can currently be viewed as a time journey at map.geo.admich.ch and downloaded\
    \ as yearly updates at https://data.geo.admin.ch/browser/index.html#/collections/ch.are.siedlung."
