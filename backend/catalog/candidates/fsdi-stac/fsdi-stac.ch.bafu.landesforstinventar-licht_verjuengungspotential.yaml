harvested:
  title: Switzerland-wide maps showing light-induced regeneration potential (as of
    NFI VHM 2024)
  description: 'The map shows where light conditions are sufficient for sufficient
    height growth of regeneration (<= 300 cm) for each tree species group. The map
    is based on expert field surveys in 39 forest districts spread across Switzerland
    and at various altitudes, as well as on the degree of canopy opening derived from
    LiDAR data. The tree species considered were divided into the classes listed below
    based on their light requirements. The map can also be used as a guide for other
    tree species in the respective class:<br><br> <ul> <li>Larch, birch, English oak,
    sessile oak, Scots pine, and cherry: light-demanding tree species (class 1),</li>
    <li>Sycamore maple and Norway maple: semi-light-demanding tree species (class
    2),</li> <li>Spruce, small-leaved and large-leaved lime: semi-shade tree species
    (class 3),</li> <li>Beech and fir: shade tree species (class 4),</li> <li>Too
    dark for all tree species to grow (class 5).</li> </ul> <ul>Purpose: The map shows
    whether the local light conditions are sufficient for young trees to grow vigorously
    into pole wood without additional intervention, thus identifying potentially necessary
    silvicultural measures at an early stage.</ul> <ul>Notes on use: Support for foresters
    and forest managers in planning regeneration measures, young forest maintenance,
    tree species selection, and temporal and spatial monitoring, as the map is regularly
    updated with new LiDAR flights.</ul> <ul>Comments: The regeneration potential
    was calculated solely on the basis of the degree of canopy opening, which takes
    into account the shading caused by the surrounding tree crowns and the terrain.
    Direct sunlight has not been taken into account so far, as this leads to statistically
    less reliable results. This means that slope exposure or the orientation of gaps
    cannot be taken into account at this stage. Similarly, no altitude-specific subdivisions
    can be made at present, as the national model used performs best in statistical
    tests. In stands with trees and shrubs of approx. 3-7 m in height, the light conditions
    in the understorey are overestimated, i.e. in such cases the map shows an excessively
    high regeneration potential. The map has been reduced to the forest area according
    to the NFI, and forest roads have been masked out as much as possible.</ul> <p>The
    map shows the regeneration potential <a href="https://data.geo.admin.ch/ch.bafu.landesforstinventar-licht_verjuengungspotential/landesforstinventar-licht_verjuengungspotential/landesforstinventar-licht_verjuengungspotential.png"
    target="_blank">at the time of the LiDAR survey</a>, which was used to derive
    the canopy openness.</p>'
