  title: Orthophotos 1946 (Pixel 1.25 M)
  description: Une photo aérienne classique présente des déformations dues à l’inclinaison
    de la caméra, au relief du terrain et à l’optique de l’appareil utilisé, ce qui
    empêche toute mesure fiable ou utilisation cartographique directe. Une orthophoto,
    en revanche, est une image aérienne corrigée géométriquement par un processus
    d’ortho-rectification basé sur un modèle numérique de terrain (MNT). Ce traitement
    neutralise les effets liés au relief et à l’angle de prise de vue, garantissant
    une échelle uniforme sur toute l’image. En d’autres termes, une orthophoto simule
    une prise de vue réalisée à la verticale de chaque point du terrain qu’elle représente.
    En complément, une correction radiométrique globale a été appliquée afin d’harmoniser
    les différences de luminosité et de contraste entre les différentes prises de
    vues, assurant ainsi une homogénéité visuelle sur l’ensemble de la mosaïque. Il
    est ainsi possible de mesurer des distances, de digitaliser des objets géographiques
    avec précision et de superposer d’autres données spatiales. Les décalages au sol
    sont normalement absents, bien que des écarts puissent apparaître sur les objets
    en hauteur (bâtiments, ouvrages d’art, etc.). Pour cette orthophoto historique,
    les clichés d’origine ont été numérisés, et les paramètres d’ortho-rectification
    ont été reconstitués de manière aussi rigoureuse que possible afin d’assurer une
    superposition la plus précise possible. Toutefois, la précision géométrique reste
    inférieure à celle des prises de vues plus récentes, en raison des limitations
    techniques de l’époque et de la qualité des supports d’origine.
