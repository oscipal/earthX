harvested:
  title: Carte De Hondt 1630
  description: 'Cette version est un exemplaire partiellement coloré de la carte de
    Josse II de Hondt. La mise en couleur permet notamment de souligner les divisions
    territoriales, marquées par un simple traitillé sur les épreuves en noir. Ces
    divisions sont déjà existantes sur la carte de Jacques Goulart de 1605. L''une
    et l''autre cartes présentent la borne monumentale qui se dresse depuis 1573 entre
    Versoix et Mies; de Hondt n''a en revanche pas repris celle, plus petite, qui
    se trouvait à Vernier pour marquer le passage en France et que Goulart avait dessinée.
    Auteur : Josse II de Hondt (1593-1629) Sources : Carte du Léman de Josse II de
    Hondt (1629-1630) Epreuve colorisée de la carte de Josse de Hondt. Ville de Genève,
    Bibliothèque de Genève, Centre d''iconographie genevoise, CIG 38M 12; lien vers
    les exemplaires publiés dans la base rero doc. Cette carte, comme les autres cartes
    du Centre d''iconographie genevoise, est décrite et publiée en ligne dans la collection
    "Cartes et plans de Genève et ses environs" publiée dans la base rero doc.'
