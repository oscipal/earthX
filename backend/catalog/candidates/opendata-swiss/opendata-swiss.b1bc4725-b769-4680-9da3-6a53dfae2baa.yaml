harvested:
  title: Pollution De L'Air - Immissions No2 2022
  description: Elle est réalisée par modélisation au moyen d'une combinaison du modèle
    CHIMERE (basé sur les données provenant du cadastre des émissions romand) calé
    sur les mesures du ROPAG en interpolant par krigeage à l'échelle régionale, ainsi
    que du modèle SIRANE pour la dispersion des polluants à l'échelle des rues (au
    moyen des données du trafic routier et aérien). Ce travail a été réalisé en partenariat
    avec Atmo Auvergne-Rhône-Alpes. La valeur limite d'immission annuelle fixée par
    l'OPair est de 30 ug/m3. La mesure en continu de la qualité de l'air a commencé
    en 1973. Les immissions de NO2 sont évaluées depuis 2002 au moyen du réseau de
    capteurs passifs.
