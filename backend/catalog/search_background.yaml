# The background of the vector arm's minimum similarity (adr/0026 §4.3; docs/plans/m5/m5-23-vektorsuche.md §3.3).
#
# A hit of the vector arm counts where its cosine with the query lies at least `MIN_RELATIVE_SIMILARITY` standard
# deviations above the mean cosine of the same query with these texts. They are invented, short and general, half German,
# half English, and about nothing the catalogue offers: no title of a real entry (plan A5). The threshold was chosen on
# the evaluation set with exactly this list; changing it means measuring the set again and new vectors in the fixture.
texts:
- Haushaltsplan der Stadt mit Einnahmen und Ausgaben
- municipal budget revenue and expenditure
- Standorte der Schulen und Kindergärten
- locations of schools and kindergartens
- Wahlergebnisse der Gemeinderatswahl
- election results by polling station
