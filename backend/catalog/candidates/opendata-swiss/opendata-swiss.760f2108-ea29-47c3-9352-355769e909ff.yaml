harvested:
  title: Analyse climatique 2020 - Vitesse du vent nocturne 2020-2049
  description: 'Les données montrent la vitesse du vent (en m/s) dans le canton de
    Genève qui a été modélisé avec le modèle climatique urbain FITNAH-3D. Les résultats
    sont basés sur une résolution spatiale horizontale de 10 m et sur une situation
    météorologique estivale autochtone (condition météorologique de rayonnement à
    vent faible). Ils sont valables pour la zone de résidence humaine à 2 m du sol
    et représentent la situation de nuit à 4:00 heures (refroidissement maximal).
    Le paramètre climatique est considéré à la fois dans sa caractéristique actuelle
    et future (y compris le changement climatique et le développement futur). Les
    augmentations de température supposées pour les périodes futures se réfèrent aux
    résultats des scénarios climatiques pour la Suisse (CH2018). Les hausses de température
    correspondent au signal de changement estival moyen du scénario RCP 8.5 pour l''Ouest
    de la Suisse. Le produit est constitué d''un raster par période climatique. Période
    climatique: P1: période future 2020-2049 ("2035") -> + 1,5 °C par rapport à P0
    Scénario de développement: P1, P2 et P3: occupation des sols avec les projets
    qui devraient être réalisés d''ici 2035 Pour les zones hors canton, les données
    de base relatives à la couverture du sol ont une précision inférieure à Genève.
    Les arbres isolés et les surfaces d''imperméabilisation autour des bâtiments,
    deux facteurs qui influencent les paramètres climatiques, n''ont pas pu être intégrés
    au modèle d''analyse. Il s''agit dès lors de considérer les données hors canton
    avec prudence. Rappel : conformément aux CGU, les informations relatives à l''analyse
    climatique sont sans valeur juridique.'
