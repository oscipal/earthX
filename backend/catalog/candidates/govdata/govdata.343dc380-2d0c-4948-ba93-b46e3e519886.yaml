harvested:
  title: Modelldaten Ertragspotenzial der Offshore-Windenergie für die gesamte Nordsee,
    Ausbauszenario 2030 -08
  description: 'Die Daten umfassen die in der Nordsee errechneten Erträge von Offshore-Windparks
    in den Hoheitsgebieten der Anrainerstaaten und die dafür relevanten Windbedingungen
    unter der Annahme eines Ausbaus der Offshore Windenergie in den fünf Ausbaujahren
    2025, 2030, 2035, 2040 und 2050. Die Berechnungen wurden mit dem numerischen Wettermodell
    WRF unter Nutzung einer Parametrisierung von Windparks nach Fitch mit einer Erweiterung
    durch Vollmer et al. 2024 (doi:10.5194/wes-9-1689-2024) durchgeführt. Die Daten
    liegen in stündlicher zeitlicher und 2 km x 2 km räumlicher Auflösung für die
    Nordsee für das meteorologische Jahr 2006 vor. Die Variablen des Datensatzes sind
    Windgeschwindigkeit (WS) und Windrichtung (WD) auf 9 Höhenleveln zwischen 50 m
    und 350 m, die Leistung (POWER) der Windturbinen aus jeder Gitterzelle und die
    Luftdichte. Eine genauere Beschreibung der Variablen findet sich in den Dateien.


    Bericht: https://www.bsh.de/DE/THEMEN/Offshore/Meeresfachplanung/_Anlagen/Downloads/IWES_Bericht.pdf?__blob=publicationFile&v=1'
