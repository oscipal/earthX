harvested:
  title: Erosion risk map for arable land, with average soil erosion in tonnes /(ha*year)
  description: "Erosion risk map for arable land, with average soil erosion in tonnes\
    \ /(ha*year) (Federal Office for Agriculture)\r\nErosion risk map for arable land\
    \ in Switzerland in a 2x2-metre grid based on SwissALTI3D and cantonal surface-area\
    \ data on arable land (status 2021). The map shows the long-term average potential\
    \ soil erosion in tonnes per hectare and year, calculated on the basis of bare\
    \ fallow (erosion which theoretically could occur if the soil were permanently\
    \ bare). Shades of green, yellow and red mean a slight, average and high risk\
    \ of erosion, respectively. The values calculated in the model are consistently\
    \ much higher than in actual fact (by around a factor of 10), since soil tillage\
    \ and management (C-factor) were excluded and incorporated in the calculation\
    \ as a constant with the value of 1. Calculating the erosion risk with multiple-flow\
    \ algorithms allows us to illustrate the structure of the terrain in great detail\
    \ – e.g. the shape of basins or of steep transverse slopes – and hence e.g. also\
    \ to identify the risk of thalweg erosion. This is shown in detail in the flow-path\
    \ map (which see). Field blocks (see field-block map) constitute the basis of\
    \ the spatial calculation."
