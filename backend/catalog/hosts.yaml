# The limits per host, for all instances of the platform together (docs/plans/m5/m5-36-grenzen-je-host.md, G1, G2).
# Every host a full entry names (`source.endpoint`, `source.asset_hosts`) or a source of the harvest asks (`sources/`,
# M5-19) has one entry here, and every entry here belongs to such a host. `connections`: requests or GDAL readers at
# once; `interval_s`: the least time between the starts of two requests, left out where the source sets no rule. `api` and `tiler` share `connections` among their
# instances (EARTHX_SOURCE_INSTANCES); tiles and search keep no interval (G3).

hosts:
  data.geo.admin.ch:
    connections: 6
    interval_s: 1.0
    reason: FSDI, fair use; swisstopo may throttle excessive use (adr/0023 §3.1, M5-08 plan §4.2)
  data.bev.gv.at:
    connections: 6
    interval_s: 1.0
    reason: BEV, one Apache server without a CDN for feeds and files; as the FSDI (M5-09 F3, plan §2.4)
  earth-search.aws.element84.com:
    connections: 6
    reason: STAC API of Element 84, no published limit; the platform's default of adr/0005 §6
  copernicus-dem-30m.s3.amazonaws.com:
    connections: 32
    reason: S3 bucket on AWS; S3 bears thousands of requests per second and prefix (M5-35 §2.2)
  esa-worldcover.s3.eu-central-1.amazonaws.com:
    connections: 32
    reason: S3 bucket on AWS; S3 bears thousands of requests per second and prefix (M5-35 §2.2)
  sentinel-s1-l1c.s3.eu-central-1.amazonaws.com:
    connections: 32
    reason: S3 bucket on AWS; S3 bears thousands of requests per second and prefix (M5-35 §2.2)
  e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com:
    connections: 32
    reason: S3 bucket on AWS; S3 bears thousands of requests per second and prefix (M5-35 §2.2)
  www.govdata.de:
    connections: 2
    interval_s: 1.0
    reason: GovData, CKAN catalogue read by the harvest page by page; no published limit (M5-19 F6, adr/0025 §6.2)
  ckan.opendata.swiss:
    connections: 2
    interval_s: 1.0
    reason: opendata.swiss, CKAN catalogue read by the harvest page by page; no published limit (M5-19 F6, adr/0025 §6.2)
  www.data.gv.at:
    connections: 2
    interval_s: 1.0
    reason: data.gv.at, CKAN catalogue read by the harvest page by page; no published limit (M5-19 F6, adr/0025 §6.2)
