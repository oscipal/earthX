harvested:
  title: Exceedance of critical loads for nitrogen
  description: 'Excessive deposition of reactive nitrogen compounds (NO₂, NO₃⁻, HNO₃,
    NH₃, NH₄⁺) causes eutrophication (over-fertilisation) of sensitive ecosystems,
    contributes to soil acidification and can lead to elevated nitrate leaching with
    associated leaching of nutrients in the soil. In addition, it also leads to increased
    production of nitrous oxide. Methods for establishing critical loads for nitrogen
    are developed and applied in the framework of the UNECE convention on long-range
    transboundary air pollution. The time series shows the exceedances of the critical
    loads for nitrogen for sensitive ecosystems for the years 1990, 2000, 2005, 2010,
    2015 and 2020 in a resolution of 1 square kilometre. Critical loads only apply
    for areas containing sensitive ecosystems. The inventories of the following sensitive
    ecosystems were used for the map: i) Raised bogs and fens from the Federal Inventories
    of Raised and Transitional Bogs and Fenlands; ii) Dry grasslands from the National
    Inventory of Dry Grasslands; iii) Various types of vegetation declared worthy
    of protection, from the vegetation atlas by Hegg et al. (1993); iv) Sites containing
    mountain hay meadows that are part of the Swiss Biodiversity Monitoring (122 sites);
    v) Oligotrophic alpine lakes in southern Switzerland (100 lakes); vi) National
    Forest Inventory sites (10331 sites) and 301 additional sites used for dynamic
    modelling. Sensitive ecosystems that are not included in these datasets are not
    considered. Detailed information about the model can be found in the report Critical
    Loads of Nitrogen and their Exceedances. Actual critical load exceedances can
    deviate from the modelled grid data. Single pixels must not be used for assessing
    critical load exceedances at single sites.'
