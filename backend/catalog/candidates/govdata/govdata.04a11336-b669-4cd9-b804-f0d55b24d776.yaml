harvested:
  title: Modelldaten mehrjähriges Ertragspotenzial Offshore-Windenergie Nordsee -2014-06
  description: Die Daten umfassen die im deutschen Hoheitsgebiet und der ausschließlichen
    Wirtschaftszone (AWZ) errechneten Erträge von Windparks und die dafür relevanten
    Windbedingungen unter der Annahme eines Ausbausszenarios (S16) der Offshore Windenergie
    für 10 aufeinanderfolgende meteorologische Jahre. Die Berechnungen wurden mit
    dem numerischen Wettermodell WRF unter Nutzung einer Parametrisierung von Windparks
    nach Fitch durchgeführt. Die Daten liegen in 10-minütlicher zeitlicher und 2 km
    x 2 km räumlicher Auflösung für die Nordsee für die meteorologischen Jahre 2013-2022
    vor. Die Variablen des Datensatzes sind Windgeschwindigkeit (WS) und Windrichtung
    (WD) auf 9 Höhenleveln zwischen 50 m und 350 m, die Leistung (POWER) der Windturbinen
    aus jeder Gitterzelle und die Luftdichte. Eine genauere Beschreibung der Variablen
    findet sich in den Dateien.
