# EarthX compose topology (architekturplan.md 3.2, 12.1; docs/plans/m1-08-compose-topologie.md,
# docs/plans/m1-07-stac-api.md §8).
#
# One image (backend/Dockerfile), four start commands: api, tiler, worker,
# harvester. tiler/worker/harvester are M1 shells: they start, report
# healthy on /health, and do nothing else. api serves the outward STAC API
# (M1-07) and is the only process that needs the collection catalog-load
# writes.
#
# Configuration only via environment variables (.env, see .env.example).
# No secrets in this file itself.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: installs the pgstac schema, then exits. Not part of the
  # "four processes" — it only prepares postgres for them.
  pgstac-migrate:
    build:
      context: ./backend
    command: ["pypgstac", "migrate"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: applies our own migrations (e.g. the search cache table from M1-06)
  # and loads the registry's collections into pgstac, then exits. Runs after
  # pgstac-migrate, because it writes into the schema that installs (M1-07;
  # earthx/catalog/load.py). Without this, a fresh compose start has neither
  # the Sentinel-2 collection nor the search cache table.
  catalog-load:
    build:
      context: ./backend
    command: ["python", "-m", "earthx.catalog.load"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-off, run by hand: `python -m earthx.discovery.materialize <dataset_id>`
  # (M3-11b plan §3.7, F8). Under a profile so a plain `docker compose up`
  # never starts it: the one materialized dataset today (`cop-dem-glo-30`)
  # reaches a real external bucket, which must never happen from CI or an
  # ordinary local start. Run it with:
  #   docker compose run --rm materialize cop-dem-glo-30
  materialize:
    profiles: ["materialize"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "earthx.discovery.materialize"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      catalog-load:
        condition: service_completed_successfully

  # M3-23 (adr/0012): Garage replaces MinIO. Three parts, because Garage's
  # image has no shell (see below) and its `--default-bucket` flag reads the
  # S3 key only from an env var, not from a file — so secrets are generated
  # in a one-shot step before Garage starts, and the S3 key/bucket are
  # created after it starts, over its admin API. `compose/objectstore/`
  # holds the scripts and config; none of this is application code
  # (backend/earthx is untouched, adr/0012 F5).

  # One-shot: writes any secret that .env does not already provide
  # (RPC secret, admin token, and — unless S3_ACCESS_KEY/S3_SECRET_KEY are
  # set — the S3 key) as 0600 files into the objectstore-secrets volume.
  # Idempotent: never overwrites an existing file.
  objectstore-secrets:
    build:
      context: ./backend
    entrypoint: ["python", "/objectstore/bootstrap.py"]
    command: ["secrets"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - ./compose/objectstore:/objectstore:ro
      - objectstore-secrets:/secrets
    restart: "no"

  objectstore:
    # `dxflrs/garage` is `FROM scratch` (Deuxfleurs' own Dockerfile): a
    # single static binary, no shell, no curl — hence the healthcheck below
    # instead of the `curl`-based ones used elsewhere in this file, and why
    # secrets can only reach it as files, not through an entrypoint script.
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET_FILE: /secrets/rpc_secret
      GARAGE_ADMIN_TOKEN_FILE: /secrets/admin_token
    ports:
      - "3900:3900"
    volumes:
      - ./compose/objectstore/garage.toml:/etc/garage.toml:ro
      - objectstore-secrets:/secrets:ro
      - objectstore-data:/data
    depends_on:
      objectstore-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: imports the S3 key and creates the bucket over Garage's admin
  # API (port 3903, not published — compose-internal only), then grants the
  # key access. Idempotent.
  objectstore-init:
    build:
      context: ./backend
    entrypoint: ["python", "/objectstore/bootstrap.py"]
    command: ["init", "--admin-url", "http://objectstore:3903"]
    volumes:
      - ./compose/objectstore:/objectstore:ro
      - objectstore-secrets:/secrets:ro
    depends_on:
      objectstore:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    # M3-16: `--no-access-log` — uvicorn's own access log would write the raw
    # query string (an AOI as `bbox`/`intersects`); `RequestIdMiddleware`
    # (earthx.logging) is this process's access log instead.
    command: ["uvicorn", "earthx.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    environment:
      # M1-07: api now connects to Postgres itself (stac-fastapi-pgstac's own
      # asyncpg pool, and earthx.api.dependencies' psycopg pool for the search
      # cache) — both read these same libpq-style names, like pgstac-migrate
      # and catalog-load already do above. The prototype's stub never needed
      # them; the STAC API does.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # M3-07a: unset (the default) turns place search off — `api.dependencies`
      # treats an empty value the same as unset.
      EARTHX_GEOCODER_URL: ${EARTHX_GEOCODER_URL:-}
      EARTHX_GEOCODER_USER_AGENT: ${EARTHX_GEOCODER_USER_AGENT:-}
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
      catalog-load:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  tiler:
    build:
      context: ./backend
    # M2-04: the entrypoint moved from `earthx.access.main` to `earthx.api.tiler`.
    # `access` may not import `gateway` (architekturplan.md 3.1), but the tile path
    # needs the allowlist, check_url and the GDAL configuration — so `api` composes
    # them (adr/0006 §5.1).
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.api.tiler:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8001:8000"
    environment:
      # Like `api` above: the tiler reads the item cache and the statistics cache of
      # adr/0006 from the same Postgres. Both caches are optional (a miss is slower,
      # never wrong), but the process opens the pool at startup — M1-07 showed that a
      # service without these variables does not come up at all.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
      # The statistics cache table comes from our own migration 003, which
      # catalog-load applies.
      catalog-load:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.jobs.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  harvester:
    build:
      context: ./backend
    # M3-16: see the `api` service above — same reason for `--no-access-log`.
    command: ["uvicorn", "earthx.discovery.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  # M3-23: the previous `minio-data` volume is not renamed or migrated — an
  # existing one is simply orphaned (README, "Umstieg von MinIO"); deleting
  # it is Otto's call, not this compose file's.
  objectstore-data:
  objectstore-secrets:
