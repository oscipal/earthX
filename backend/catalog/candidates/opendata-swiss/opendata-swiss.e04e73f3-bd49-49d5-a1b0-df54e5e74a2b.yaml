  description: 'Cette carte a pu être reconstituée grâce à l''assemblage et le géo-référencement
    de trois cartes originales sur support papier, conservées aux Archives d''Etat
    de Genève (AEG). Ces cartes des limites du canton de Genève du côté de la Savoie
    sont conformes au procès-verbal de délimitation du 15 juin 1816 ; elles sont signées
    Provana de Collegno et Charles Pictet-de-Rochemont (annexe de Savoie 37). Pour
    en savoir plus sur la série des plans annexes aux traités entre Genève et ses
    voisins, voir le descriptif du plan annexe du traité de Paris de 1749. Auteur
    : Service du Grand Conseil'
