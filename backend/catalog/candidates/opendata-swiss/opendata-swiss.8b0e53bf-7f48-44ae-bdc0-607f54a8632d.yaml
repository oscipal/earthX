harvested:
  title: Klimaanalyse - Physiologisch Äquivalente Temperatur Tag Ist 2020
  description: 'Physiologisch Äquivalente Temperatur (PET) um 14 Uhr 1,1 Meter über
    Grund in Grad Celsius [°C] für den Zustand Ist 2020. Basierend auf der Lufttemperatur,
    Luftfeuchte, Strahlung und Windgeschwindigkeit beschreibt die PET die Wärmebelastung
    für die Menschen. <br><br> Gehört zum Thema Klimaanalyse: <br> Der Klimawandel
    stellt eine neue Herausforderung für die Siedlungsentwicklung dar. Vor diesem
    Hintergrund wurde die heutige (Ist 2020) und künftige (Zukunft 2060) klimatische
    Situation flächendeckend für den Kanton Solothurn modelliert (Klimaanalyse). Die
    Modellergebnisse und die daraus resultierenden Klimaanalyse- und Planungshinweiskarten
    (zusammen: Klimakarten) geben Aufschluss über die klimatische Situation: Wo befinden
    sich die Hot-Spots im Siedlungsgebiet? Welche Grün- und Freiräume sind wichtig
    für die Kaltluftproduktion? Wo verlaufen wichtige Kaltluftleitbahnen, die es freizuhalten
    gilt?'
