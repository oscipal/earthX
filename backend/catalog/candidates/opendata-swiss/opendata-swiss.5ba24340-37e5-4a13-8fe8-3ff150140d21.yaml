harvested:
  title: Carte Duvillard 1588
  description: La carte de Jean Duvillard comporte deux parties. Une vue du lac Léman
    et de ses environs immédiats et une liste de dix-neuf espèces de poissons, – plus
    les écrevisses, le vengeron et les huitres lacustres – qui peuplent ses eaux accompagnée
    d'un dessin de chacune d'entre elles. Cette seconde partie est datée de 1581 alors
    que la carte a été faite sept ans plus tard. Elle comporte en outre un texte introductif
    donnant la date d'exécution, le nom de l''auteur et les armoiries de sa famille.
    Cette carte du Léman, qui a été utilisée par Jacques Goulard pour établir la sienne
    au début du XVIIe siècle, a été oubliée par la suite et n'a été redécouverte qu'en
    1827, reliée en fin d'un livre de géographie de la Bibliothèque de Genève. Jusqu'à
    la Renaissance, la région lémanique n'est figurée que sur des cartes à grande
    échelle qui représentent le monde ou l'ensemble du continent. La plus ancienne
    qui soit conservée est la Table dite de Peutinger, copie médiévale d'un document
    antique qui montre le "lacus Losanna" sur une carte du réseau routier de l'Empire
    romain. La carte de Duvillard constitue l'un des meilleurs exemples genevois de
    la cartographie humaniste du XVIe siècle. Jean Duvillard n'a apparemment pas fait
    oeuvre de topographe mais s'est inspiré de documents existants qu'il actualise
    en les complétant d'informations nouvelles. Son modèle principal est la carte
    que le médecin Thomas Schöpf avait dessinée de l'Etat de Berne et qui avait été
    publiée après sa mort en 1578 à Strasbourg. Duvillard reprend même certains détails
    comme les chamois ou chevreuils qui s'affrontent au-dessus d'Evian.
