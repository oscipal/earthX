# Earth Search v1 of Element 84, adr/0023; one page of collections with a weak ETag that answers 304 (adr/0025 §3).
source_id: earth-search
protocol: stac-api
endpoint: https://earth-search.aws.element84.com/v1
# Element 84 has no page per collection of its own; the STAC Browser of Radiant Earth shows a collection of this API
# with its items and their files (M5-19 F9 = 1, Otto 17.11.2026). A setting of this source, not a rule for others.
catalog_page: https://radiantearth.github.io/stac-browser/#/external/earth-search.aws.element84.com/v1/collections/{id}
filter:
  collection_prefixes: []
max_requests_per_run: 20
full_every_days: 1
robots_exception: null
maturity: stable
enabled: true
