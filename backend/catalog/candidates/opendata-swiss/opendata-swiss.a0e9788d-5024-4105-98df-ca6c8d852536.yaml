  description: Bei der Ebene "Relief digitales Terrainmodell LiDAR (2018)" handelt
    es sich um die schattierte Abbildung der Erdoberfläche ohne Gebäuden und Vegetation.
    <br> Die Daten basieren auf luftgestützten Lasermessungen mit einer mittleren
    Punktdichte von 16 Punkten pro m2 und einer Höhengenauigkeit von 10 cm (1 Sigma=68%).
    Die Auflösung des Reliefs beträgt 25 cm. Die Befliegung erfolgte im Frühjahr 2018.
