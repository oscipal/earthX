harvested:
  title: Wasserpflanzen
  description: 'Die Ebene Wasserpflanzen stellt dar, wo in Berner Gewässer Wasserpflanzen
    kartiert wurden und welche Arten vorkommen. Wasserpflanzen sind wichtige Indikatoren
    für den Zustand eines Sees: Sie zeigen, wie gesund er ist und wie sich Veränderungen
    im Nährstoffgehalt, aber auch der Klimawandel oder invasive Arten auf den See
    auswirken. Ausserdem zeigt die Ebene, wo im Brienzer-, Thuner- und Bielersee Schilfpflanzen
    und Makrophyten vorkommen könnten.'
