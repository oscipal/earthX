harvested:
  title: Nighttime railway noise exposure
  description: The map shows the nighttime railway noise to which the population is
    exposed. The noise calculation is based on emission data for 2021 as reported
    in the railway noise register as “actual emissions.” These were calculated for
    the SBB, BLS, SOB, SZU, Zentralbahn, and RhB networks on the basis of traffic
    data provided by SBB and recorded in the 2021 emissions register (EK2021). Of
    the total 5,800 km of tracks for rail-bound traffic under federal supervision,
    approximately 4,165 km are listed in EK2021. The data is not legally binding.
    Binding information on noise pollution and noise abatement is provided by the
    federal enforcement authority, the Federal Office of Transport (FOT).
